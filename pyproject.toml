[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-mcp-server"
version = "1.0.0"
description = "Production-grade ArXiv + Semantic Scholar MCP server for LLM research agents"
authors = [{ name = "Meet Vyas", email = "meetrvyas7@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "fastmcp>=3.4.0,<4.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "defusedxml>=0.7.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
    "responses>=0.25",   # mock requests in tests
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
arxiv-mcp-server = "arxiv_mcp.server:main"

[project.urls]
Homepage   = "https://github.com/MeetRVyas/arxiv-mcp-server"
Repository = "https://github.com/MeetRVyas/arxiv-mcp-server"
Issues     = "https://github.com/MeetRVyas/arxiv-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["arxiv_mcp"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"